<!DOCTYPE html>

      body { margin: 0; padding: 3rem 2rem; background: pink; color: #141414; font-family: sans-serif; }
      a { color: #141414; font-weight: 700; }
      a:hover { color: #ff284d; }

    <script>
      // pages used to live under the /up_/src/ prefix parcel generated
      var moved = location.pathname.match(/^\/up_\/src\/(.*)$/);
      if (moved) {
        location.replace('/' + moved[1].replace(/^CV\.html$/, 'cv.html'));
      }
    </script>
  </head>

    <p>Try the <a href="/">home page</a>, <a href="/art.html">artwork</a>, <a href="/cv.html">CV</a> or <a href="/statement.html">statement</a>.</p>
